version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile   
    image: its_app:latest     
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
    env_file:
      - .env
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/config/db.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./src/config/data.sql:/docker-entrypoint-initdb.d/2-data.sql
    restart: always

volumes:
  postgres-data:

